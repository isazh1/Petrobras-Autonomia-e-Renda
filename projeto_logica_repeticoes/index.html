<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estruturas de repetições</title>

    <script src="js/scripts_repeticoes.js" defer></script>
</head>
<body>
    <div id="geral">
           <h1>Estrutura for</h1>

           <div id="div-for"></div>

           <h1>Contador e Acumulador</h1>
           <input type="text" name="num1" id="num1">
           <button id="btn-num1">Adicionar num1</button>

           <div id="result-cont-acum"></div>

           <h1>REPETIÇÃO COM WHILE</h1>
           <label for="msg">Digite uma frase</label>
           <input type="text" name="msg" id="msg"><br><br>

           <label for="numRepeticao">Digite a quantidade para repetição da frase</label>
           <input type="text" name="numRepeticao" id="numRepeticao"><br><br>

           <button id="btn-exibir">Exibir frase</button>

           <div id="result-frase"></div>

           <h1>FOR IN</h1>

           <div id="div-forin"></div>

           <h1>FOR OR</h1>

           <div id="div-foror"></div>
    </div>
     
</body>
</html>
